["economy","Economy","📊","IKT001","VERIFIED",["India's economy is a mixed economy with agriculture, industry and services all contributing to output and employment.","GDP measures the value of final goods and services produced within the economy, while GVA tracks value added by sectors before taxes less subsidies.","National-account figures should be read with their reference period, unit, revision status and underlying methodology.","Indian economic analysis commonly uses household consumption, private investment, government demand, exports and imports, with each component responding to different conditions.","Agriculture, manufacturing, construction and services have different productivity, employment and demand patterns, so sector-level analysis matters alongside headline GDP.","Separate nominal values from inflation-adjusted real values, and distinguish annual growth, quarterly movement, per-capita measures and structural change.","Inflation, interest rates, credit conditions, commodity prices, exchange rates and global demand affect households and businesses through different channels.","Fiscal and monetary policy affect demand, financing conditions, prices and public investment through different channels.","MoSPI, RBI, the Ministry of Finance and sector ministries publish different parts of India's economic evidence."],["mospi","rbi","budget"],["GDP / GVA","real vs nominal growth","per-capita income","sector composition"]],
["demography","Demography","👥","IKT002","PROVISIONAL",["The Census of India is the principal source for population and demographic characteristics.","Population analysis covers size, age structure, sex composition, fertility, mortality, migration, household structure and urbanisation.","Population size is a stock that changes through births, deaths and migration, which are flows.","Age structure affects schools, labour supply, healthcare, pensions and the dependency ratio.","A population pyramid shows the balance between children, working-age adults and older people, informing education, jobs, healthcare and pensions.","Fertility, mortality and life expectancy are core demographic measures used to understand births, deaths and long-term population change.","Migration and urbanisation change where infrastructure, housing and public services are needed.","Demographic transition can change dependency ratios, labour supply, consumption patterns and the demand for public services over time.","Census counts, sample surveys and population projections answer different questions and should not be treated as interchangeable datasets.","State and district differences can be large, so an India-wide average should not be treated as representative of every state or community."],["census","mospi"],["population","sex ratio","age structure","urbanisation rate","dependency ratio"]],
["stock-market","Stock Market","📈","IKT003","VERIFIED",["BSE (established 1875) is Asia's oldest stock exchange; NSE (established 1992) introduced electronic trading to India.","Sensex tracks 30 BSE-listed large companies; Nifty 50 tracks 50 NSE-listed large companies.","SEBI is the market regulator; trading runs Monday to Friday with a special one-hour Diwali 'Muhurat' session.","The settlement cycle is T+1 (trade date plus one working day) for most segments.","Equity markets connect companies seeking capital with investors accepting market risk in exchange for potential returns.","Primary markets cover issuance such as IPOs and follow-on offerings; secondary markets provide trading and price discovery.","Indices such as Nifty 50 and Sensex are baskets constructed using defined methodologies; an index movement is not the same thing as the return of every listed company.","Corporate actions can include dividends, bonus issues, rights issues, splits, mergers and buybacks, each of which can affect price series and investor holdings.","India's market infrastructure includes NSE, BSE, SEBI, NSDL, CDSL and clearing corporations.","Analysis should distinguish price return, total return, valuation, earnings, cash flow, leverage, liquidity and regulatory disclosures rather than relying on a single number.","Company filings, exchange notices, SEBI rules, taxation and risk disclosures form the practical market context for Indian investors."],["sebi","nse","bse"],["index level","market capitalisation","P/E","corporate actions"]],
["public-finance","Public Finance","🏛️","IKT004","VERIFIED",["Public finance covers government revenue, expenditure, borrowing, deficits and public debt.","The Union Budget presents the central government's annual financial estimates and policy priorities.","Government revenue includes tax and non-tax receipts.","Budget analysis separates receipts from expenditure and distinguishes revenue items from capital items.","Capital expenditure can create or improve public assets, while revenue expenditure generally supports ongoing administration and services; classifications follow official budget rules.","The fiscal deficit represents the government's borrowing requirement after accounting for its receipts and expenditure under the stated budget framework.","Public debt analysis covers outstanding liabilities, interest costs, maturity structure, borrowing sources and the relationship between debt and economic output.","Budget estimates, revised estimates and actuals are different stages of the fiscal reporting cycle and should be compared carefully.","India has Union, state and local public finances with different responsibilities.","Fiscal policy affects households and businesses through taxes, public investment, subsidies, welfare spending, borrowing costs and government demand.","The Union Budget, Finance Accounts, CAG reports, RBI publications and state budget documents provide complementary views of Indian public finances."],["budget","rbi"],["fiscal deficit % GDP","revenue vs capital expenditure","debt / GDP","tax revenue share"]],
["agriculture","Agriculture","🌾","IKT005","VERIFIED",["Agriculture supports food supply, rural livelihoods and several downstream industries.","Agriculture includes crop production, horticulture, livestock, fisheries and related value chains.","India produces a wide range of cereals, pulses, oilseeds, fruits, vegetables, fibres and plantation crops.","Crop systems vary by agro-climatic region, irrigation availability, soil, rainfall, farm size, market access and input use.","Key production stages include land preparation, seed selection, sowing, nutrient management, irrigation, pest control, harvesting, storage and marketing.","Farm economics depends on yield, input costs, labour, machinery, land arrangements, prices, post-harvest losses and access to credit or insurance.","Procurement, minimum support prices, agricultural markets, warehouses, crop insurance and irrigation are distinct policy mechanisms.","Agricultural statistics should distinguish production, area sown, yield, procurement and marketed surplus because these measure different parts of the system.","State-level crop patterns differ substantially, so Indian agriculture should be analysed by crop, region, season and production system rather than as one uniform sector."],["agricoop"],["area sown","production","yield","MSP","procurement"]],
["industry-msme","Industry / MSME","🏭","IKT006","PROVISIONAL",["MSMEs are classified under India's current framework using investment and turnover criteria.","MSME classification and registration determine how eligible enterprises are identified for formal recognition and access to applicable support, credit and compliance systems.","MSMEs operate across manufacturing and services, including small factories, repair businesses, food processing, textiles, engineering, logistics and professional services.","MSMEs often participate in larger supply chains as suppliers, distributors, service providers and subcontractors.","Common operating issues include working capital, delayed payments, access to formal credit, technology adoption, quality standards and market linkages.","Industrial competitiveness depends on infrastructure, logistics, skills, energy costs, standards and supply-chain integration.","Industrial analysis can combine factory output, capacity utilisation, employment, credit, exports, registrations and business closures rather than using registrations alone.","Distinguish an enterprise's legal status, MSME classification, turnover, investment, employment and sector because these are not interchangeable measures.","Current thresholds and scheme rules should be checked against Ministry of MSME notifications and the official Udyam portal."],["msme","udyam"],["Udyam registrations","investment & turnover slabs","credit flow","delayed payments"]],
["digital-economy","Digital Economy","📱","IKT007","VERIFIED",["UPI (launched 2016) is described by NPCI as the world's largest real-time payments system; transaction volumes change monthly, so verify current statistics from NPCI.","UIDAI describes Aadhaar as the world's largest biometric identity system; government reporting in 2026 put Aadhaar enrolments above 144 crore, so current counts should be checked on UIDAI's dashboard.","Digital India (launched 2015) is the umbrella programme for e-governance and digital infrastructure.","India has a large mobile-data market and a major IT/BPM export sector; telecom tariffs and comparative price rankings change over time and should be checked against current TRAI data.","The digital economy includes digital payments, online commerce, telecom connectivity, software services, cloud infrastructure, digital public services and data-enabled businesses.","Digital public infrastructure can allow interoperable identity, payments and document or service layers to be reused across applications.","UPI, Aadhaar, DigiLocker and related systems have different purposes and governance arrangements and should not be treated as one single platform.","Digital growth depends on network access, device availability, affordability, cybersecurity, digital literacy, trust and reliable service delivery.","Digital adoption should be assessed through access, usage, reliability, security, affordability and inclusion rather than transaction volume alone.","NPCI, UIDAI, MeitY, DoT and TRAI publish different parts of the Indian digital ecosystem's evidence."],["npci","uidai","meity","trai","dot"],["UPI volumes","telecom subscribers","internet penetration","IT/BPM exports"]],
["energy","Energy","⚡","IKT008","VERIFIED",["India's energy system includes coal, petroleum and gas alongside hydro, nuclear and renewable sources.","Electricity capacity is a maximum installed capability, while electricity generation measures actual energy produced over a period — the two should not be conflated.","Electricity systems must balance generation, grid capacity, storage or flexibility and demand at different times.","Energy security involves diversification, domestic resources, imports, infrastructure resilience, grid stability and affordability.","Solar, wind, hydro and nuclear contribute through distinct generation characteristics within the power mix.","Energy policy can be studied through capacity additions, generation mix, peak demand, transmission expansion, efficiency and emissions intensity.","Coal and petroleum remain important to India's energy system while low-carbon sources are expanding within the power mix.","Indian energy policy also involves import dependence, grid reliability and the transition toward lower-emission technologies.","Current capacity, generation, tariffs and policy changes should be checked with the Ministry of Power, CEA, MNRE and petroleum-sector authorities."],["power","cea","mnre"],["installed capacity","generation mix","peak demand","plant load factor"]],
["water","Water","💧","IKT009","VERIFIED",["India's water resources vary substantially across regions and seasons.","Water management covers surface water, groundwater, rainfall, rivers, reservoirs, irrigation, drinking water, sanitation and industrial use.","A river basin can cross administrative boundaries, so water planning often requires coordination between multiple states and institutions.","Groundwater availability depends on recharge, extraction, aquifer characteristics and local land and cropping patterns.","Water quality is separate from water quantity; safe supply requires monitoring contaminants and maintaining treatment and distribution systems.","Urban water systems include source development, treatment, distribution, leakage control, metering where used, wastewater collection and reuse.","Practical Indian water analysis should distinguish physical availability, extraction, treatment, distribution, agricultural use and household access.","Indian water policy involves central ministries, state departments, local bodies and basin-level institutions with different responsibilities.","Current water-stress and groundwater figures should be checked against the latest government assessment."],["jalshakti"],["rainfall","groundwater level","reservoir storage","irrigated area"]],
["health","Health","🏥","IKT010","PROVISIONAL",["India's health system combines public and private providers across primary, secondary and tertiary care.","National Health Programmes address areas such as immunisation, maternal health, communicable diseases and non-communicable diseases.","Health systems combine prevention, primary care, secondary and tertiary treatment, medicines, diagnostics, public-health surveillance and emergency response.","Maternal and child health indicators cover antenatal care, institutional delivery, maternal outcomes, immunisation, nutrition and childhood illness.","Disease surveillance tracks outbreaks and patterns over time and supports early response through laboratory, clinical and reporting networks.","Health financing can involve government budgets, insurance, household out-of-pocket spending and public-private service delivery.","Health infrastructure should be assessed through facilities, staffing, equipment, service availability, quality and geographic access rather than facility counts alone.","The Union government, states and local systems share responsibilities across public-health delivery and implementation.","Healthcare access in India varies by state, urban-rural setting, income, workforce availability and facility capacity."],["mohfw","icmr","nfhs","aiims"],["IMR / MMR","immunisation coverage","out-of-pocket spend","health workforce density"]],
["education","Education","🎓","IKT011","VERIFIED",["The Right to Education Act (2009) makes education free and compulsory for children aged 6–14.","The National Education Policy 2020 replaced the 1986 policy and introduced a 5+3+3+4 school structure.","India's literacy rate rose from about 18% at independence (1951 Census) to roughly three-quarters of the population by the 2011 Census.","UGC is associated with coordination and standards in higher education, while AICTE is associated with planning and standards for technical education; current rules should be checked with the authorities.","Education analysis covers access, enrolment, attendance, learning outcomes, teachers, infrastructure, curriculum, assessment and financing.","Learning outcomes measure what students know or can do, while enrolment measures participation; the two should not be treated as substitutes.","Vocational and skill pathways connect education with occupational standards, apprenticeships and labour-market requirements.","Education quality also depends on teacher preparation, instructional time, language of learning, learning materials, technology and student support.","The Union, states, boards, universities, regulators and institutions have different roles in India's education system.","For practical education planning, distinguish eligibility, admission route, curriculum, fees, recognition, location and employment outcomes."],["moe","udise","ugc","aicte","cbse","nta"],["enrolment (GER)","dropout rate","pupil-teacher ratio","learning outcomes"]],
["employment","Employment","💼","IKT012","VERIFIED",["PLFS is a major official source for labour-market statistics in India.","Employment statistics distinguish labour-force participation, employment, unemployment and worker status; these are related but different measures.","LFPR, WPR and unemployment rate answer different questions, so a labour-market assessment should not substitute one measure for another.","Workers may be self-employed, regular wage or salaried employees, casual labourers or engaged in other forms of work depending on the statistical framework.","Job quality can involve earnings, hours, social security, contract stability, occupational safety, skills use and career progression in addition to whether a person is employed.","Formal and informal work have different patterns of contracts, social protection, productivity and measurement.","Sectoral shifts can move workers between agriculture, industry and services and between formal and informal arrangements.","Youth employment, female labour participation and skill matching are important dimensions of labour-market analysis.","Employment analysis should specify the survey period, age group, rural/urban coverage and definition before comparing rates."],["plfs","labour","mospi"],["LFPR","WPR","unemployment rate","sector share of employment"]],
["elections","Elections","🗳️","IKT013","VERIFIED",["The Election Commission of India conducts elections to the Lok Sabha, state legislatures and specified constitutional offices under the applicable law.","Election administration includes electoral rolls, constituencies, candidate nomination, campaigning rules, polling, counting and result declaration.","The ECI administers elections within its constitutional and statutory responsibilities, while different elections follow different legal frameworks.","Voter turnout is a participation measure and should be stated with the relevant election, electorate and denominator.","Candidate disclosures can include information required under election law and court-directed disclosure frameworks; current forms and requirements should be checked in official notices.","Election results are event-specific records and should be distinguished from opinion polls, projections or commentary.","Election analysis should distinguish registered electors, turnout, valid votes, constituencies, candidates and results.","Election data should always be tied to a particular election, constituency and date because electoral boundaries, candidates and results are time-specific.","Electoral rolls, constituencies, polling stations, EVM/VVPAT and results are core election-system components."],["eci","eci_vsp"],["electors","turnout %","valid votes","seats"]],
["defence","Defence","🛡️","IKT014","PROVISIONAL",["India's defence structure includes the Army, Navy and Air Force under the Ministry of Defence.","The Army, Navy and Air Force have distinct land, maritime and air roles and operate together when national defence requires coordinated capabilities.","Jointness focuses on coordination across the armed forces, while capability development covers personnel, platforms, technology, training, logistics and operational readiness.","Defence capability includes personnel, training, logistics, platforms, ammunition, intelligence, communications, cyber capabilities and strategic systems.","Readiness depends not only on platform numbers but also on maintenance, spares, training, availability and integration across services.","Defence procurement and modernisation involve acquiring, upgrading and sustaining equipment and systems while balancing operational requirements, cost, technology and domestic capability.","Procurement can involve domestic development, licensed production, direct acquisition, joint programmes and indigenous design depending on the programme.","Domestic defence production and indigenisation aim to increase local manufacturing, maintenance, technology capability and supply-chain resilience.","Defence budgeting covers personnel, operations, modernisation and capital acquisition under the government's accounting structure.","India's defence ecosystem includes the armed forces, DRDO, public-sector units, private industry, research institutions and technology suppliers operating within security and export-control rules."],["mod"],["capital outlay","indigenous content","service-wise allocation"]],
["trade-fdi","Trade / FDI","🚢","IKT015","VERIFIED",["100% FDI is allowed via the automatic route in most sectors, with caps or approval routes in a few sensitive ones.","DPIIT tracks FDI inflows; major investing countries include Singapore, Mauritius, the US and Japan.","India has signed FTAs and CEPAs with blocs and countries including ASEAN, the UAE and Australia.","Merchandise trade records physical goods crossing borders, while services trade covers activities such as IT services, transport, finance and business services.","The trade balance compares exports and imports of goods or other defined components; the overall external account includes additional flows.","FDI represents cross-border investment with a lasting interest or control relationship under the applicable regulatory framework and differs from portfolio investment.","Trade analysis can be broken down by partner, product, sector, value, volume and unit price to understand what is driving changes.","Trade policy includes tariffs, standards, customs procedures, trade agreements and sector-specific rules that can affect market access.","Indian trade and investment rules involve the Department of Commerce, DPIIT, DGFT, RBI, customs authorities and sector-specific regulators."],["commerce","dpiit","dgft","rbi"],["exports","imports","trade balance","FDI inflow"]],
["transport","Transport","🚆","IKT016","VERIFIED",["India's transport system includes roads, railways, aviation, ports, inland waterways and urban transit.","Transport systems serve different passenger and freight needs, and different modes have different infrastructure, safety and regulatory frameworks.","Transport performance can be assessed through passenger movement, freight movement, network capacity, travel time, safety and connectivity.","Network capacity depends on physical infrastructure, vehicles, signalling or traffic management, terminals, maintenance and operational scheduling.","Freight performance is influenced by distance, modal choice, loading efficiency, warehousing, last-mile connectivity and border or customs processes.","Transport safety uses different measures such as incidents, fatalities, compliance, infrastructure condition and operating standards.","Infrastructure investment should be assessed through capacity, utilisation, connectivity, travel time, reliability and lifecycle maintenance.","Indian logistics planning depends on multimodal connections between production centres, markets, ports, warehouses and final consumers.","Infrastructure statistics need a defined period and unit because passenger, freight, route and capacity measures answer different questions."],["indianrailways"],["network length","traffic volume","freight tonnage","accident rate"]],
["science-space","Science / Space","🚀","IKT017","VERIFIED",["India's science ecosystem includes national laboratories, universities, research agencies, technology institutions and mission-oriented programmes.","ISRO and the Department of Space are central to India's civilian space programme, while organisations such as CSIR and DST support other scientific domains.","Space activities include launch vehicles, satellites, remote sensing, communications, navigation, planetary science and human-spaceflight capabilities.","India's science system spans basic research, applied research, national laboratories, universities, strategic research and mission-oriented programmes.","Research output can be assessed through publications, patents, technology transfer, missions, prototypes, facilities and research funding depending on the field.","Scientific programmes generally involve institutions, specialised instruments, technical teams, funding cycles and peer or mission review processes.","Space data and services support agriculture, weather, disaster management, communications, navigation, mapping and other civilian applications.","Science policy considerations include research funding, human resources, technology development and technology transfer.","India-focused science analysis should distinguish research output from commercialisation, public missions and private-sector participation."],["isro","dst","csir"],["missions launched","R&D expenditure","publications","patents"]],
["climate-disasters","Climate / Disasters","🌦️","IKT018","PROVISIONAL",["India faces multiple climate and disaster risks, including floods, cyclones, droughts, heatwaves, landslides and earthquakes, with exposure differing by region and season.","The IMD provides weather and climate information, while NDMA coordinates national disaster-management policy and preparedness.","Disaster risk depends on hazard, exposure and vulnerability; the same hazard can produce very different impacts in different locations.","Climate analysis distinguishes long-term climate trends from short-term weather events and uses defined reference periods.","Early-warning systems combine observation, forecasting, risk communication, evacuation planning and response capacity.","Risk assessment identifies hazards, exposed people and assets, while preparedness converts that understanding into plans, resources, training and response arrangements.","Loss assessment should distinguish human impacts, infrastructure damage, livelihood losses and economic disruption, using the reporting methodology of the relevant authority.","Disaster risk is not only about the hazard itself; land use, infrastructure, population density and preparedness influence impacts.","IMD, NDMA, state disaster authorities and other agencies have distinct roles in Indian early warning and response systems.","Hazard warnings and forecasts are time-sensitive and should be taken from official alerts."],["imd","ndma","mha"],["rainfall departure","cyclone frequency","heatwave days","loss figures"]],
["cricket","Cricket","🏏","IKT019","VERIFIED",["BCCI governs cricket in India and runs the IPL, which was launched in 2008; current league valuations and media-rights comparisons should be checked against dated industry sources.","India has won the ODI World Cup in 1983 and 2011, and the T20 World Cup in 2007 and 2024.","India won the ICC Champions Trophy in 2013 and 2025 and has reached multiple World Test Championship finals.","The BCCI is headquartered in Mumbai and is one of the wealthiest national cricket boards globally.","BCCI administers major Indian cricket structures while the ICC governs international cricket rules and competitions at the global level.","Formats such as Test, ODI and T20 differ in playing time, strategy and competition structure.","Player statistics should specify format such as Test, ODI or T20 because averages, strike rates and workloads are not directly comparable across formats.","A match can be analysed through batting, bowling, fielding, powerplay or phase performance, wickets, run rate and situational context.","Domestic pathways include age-group cricket, state associations, recognised competitions such as the Ranji Trophy, Duleep Trophy and Vijay Hazare Trophy, and selection structures leading toward higher levels.","Player and team statistics should be tied to the format, tournament, season and official competition record."],["bcci","icc"],["match results","player averages","tournament standings"]],
["states-uts","States / UTs","🗺️","IKT020","VERIFIED",["India has states and union territories with different administrative structures and legislatures.","States and Union Territories differ in constitutional status, administrative structure, geography, population, fiscal capacity and development profile.","State governments manage major areas such as public order, health, agriculture, local government and education subject to the constitutional division of powers and applicable laws.","State finances include own tax revenue, non-tax revenue, transfers, grants, expenditure and borrowing within the relevant fiscal framework.","Comparisons between states should use the same year, definition, price basis and population denominator where possible.","District-level variation can be large within a state, so state averages do not describe every region equally.","Names, boundaries, capitals and administrative arrangements should be checked against current government sources."],["des","mospi"],["population","state income (GSDP)","sector structure","infrastructure indicators"]],
["judiciary","Judiciary","⚖️","IKT021","VERIFIED",["India has an integrated judicial system headed by the Supreme Court, with High Courts and subordinate courts below it.","The judicial structure also includes specialised tribunals and forums operating under separate legal frameworks where applicable.","Jurisdiction determines which court can hear a matter, while procedure determines how cases move through filing, hearing, evidence, orders and appeals.","Judicial review and constitutional interpretation are important functions of higher courts.","Judgments can interpret constitutional provisions, statutes, administrative decisions and legal principles; their binding effect depends on the court and legal context.","Case pendency is influenced by filing rates, disposal rates, vacancies, procedural complexity, adjournments and case type.","Legal research should distinguish the original judgment, later interpretation, amendments and current procedural rules.","Judgments should be read with the case facts, issues, legal provisions, reasoning and final directions rather than only the headline outcome.","Current Indian legal positions can change through later judgments, legislation or rules, so dated primary sources matter.","Case status, judgments and procedural information should be taken from authoritative court records rather than summaries alone."],["sci","hc"],["pending cases","disposal rate","vacancies"]],
["internal-security","Internal Security","🚓","IKT022","PROVISIONAL",["Internal security covers threats and challenges such as terrorism, organised crime, cyber threats, insurgency and border-related risks.","Internal security includes policing, organised crime, terrorism, border management, cyber threats, critical infrastructure protection and public-order functions.","Terrorism and insurgency involve violence, recruitment, financing, radicalisation or armed activity and require coordinated lawful security and civilian responses.","Counter-terrorism combines intelligence, investigation, prevention, prosecution, financial disruption and protection of vulnerable infrastructure.","Border security involves surveillance, physical infrastructure, patrols, intelligence, coordination and lawful movement management.","Critical infrastructure protection focuses on systems and facilities whose disruption could seriously affect public safety, essential services, communications, energy or the economy.","State police forces handle many policing functions while central organisations and CAPFs have defined roles in particular security situations.","Crime statistics depend on reporting, registration, classification and investigation practices, so a recorded-case figure is not identical to actual incidence.","Security analysis should distinguish crime statistics, security incidents, investigations, prosecutions and convictions because they represent different stages."],["mha","ncrb"],["recorded cases","charge-sheeting rate","conviction rate"]],
["panchayati-raj","Panchayati Raj","🏘️","IKT023","VERIFIED",["The 73rd Constitutional Amendment (1992) gave Panchayati Raj Institutions constitutional status.","It set up a three-tier system: Gram Panchayat (village), Panchayat Samiti (block) and Zila Parishad (district).", "At least one-third of seats and chairperson posts are reserved for women; several states reserve 50%.","Panchayats are meant to handle local planning, welfare-scheme delivery and civic functions.","Gram Sabha participation provides a local forum for discussing plans, public works, beneficiaries and community issues under applicable state rules.","Local bodies require functional responsibilities, financial resources and administrative capacity to deliver decentralised services effectively.","Local finance can include own-source revenue, assigned or shared revenues, grants and programme funds with different restrictions.","Functions, finances and staffing vary across states because implementation is shaped by state legislation and devolution.","Indian local-government analysis should separate constitutional provisions from state-specific implementation and actual fiscal capacity."],["panchayat"],["own-source revenue","grants","elected representatives"]],
["civil-services","Civil Services","🪪","IKT024","VERIFIED",["Civil services support policy implementation, administration, regulation and delivery of public services.","India's civil services include All India Services, central services and state services with different recruitment authorities, cadres and service rules.","UPSC conducts several central recruitment examinations, while State Public Service Commissions conduct state-level recruitment.","For specified services, UPSC examinations involve a preliminary stage, a written mains stage and a personality test, with defined eligibility conditions.","Recruitment routes differ by service and level and can involve examinations, interviews, physical or medical requirements and document verification.","Training combines foundational administration with service-specific professional preparation and field exposure.","Career progression depends on service rules, cadre, performance, seniority, postings and applicable promotion structures.","Applicants should distinguish eligibility, syllabus, vacancies, reservation rules, age limits and application dates because each recruitment notice controls the current details."],["upsc","upsconline"],["vacancies notified","candidates shortlisted","cadre allocation"]],
["banking-finance","Banking & Finance","🏦","IKT025","VERIFIED",["India's financial system includes banks, non-bank financial companies, capital markets, insurance and payment systems.","The RBI regulates banks and monetary policy, while SEBI regulates securities markets; other regulators cover insurance and pensions.","India's banking system includes public-sector banks, private banks, foreign banks, cooperative banks, small finance banks, payments banks and other regulated financial institutions.","Banking functions include deposits, lending, payments, settlement, liquidity management, risk assessment and financial intermediation.","Bank health can be studied through capital adequacy, asset quality, provisioning, profitability, liquidity and governance indicators.","The RBI uses monetary and regulatory tools to influence liquidity, inflation conditions and financial-system stability within its statutory framework.","Financial inclusion covers access to accounts, payments, credit, insurance and other services, not merely the number of bank accounts.","Digital banking and payment systems introduce operational, cyber, fraud and consumer-protection considerations alongside convenience.","For consumers, banking choices also involve interest rates, charges, KYC, grievance mechanisms, deposit protection and product suitability."],["rbi","sebi","irdai","pfrda","ibps","sbi"],["policy rate","credit growth","GNPA ratio","capital adequacy"]],
["inflation","Inflation (CPI / WPI)","💹","IKT026","PROVISIONAL",["CPI measures changes in prices paid by consumers for a defined basket of goods and services.","WPI tracks wholesale prices and has a different coverage and methodology from CPI.","A price index uses a reference framework and base period; the inflation rate compares index levels across periods according to the published methodology.","Weighting means that a price change in a high-weight item can have a larger effect on the overall index than the same percentage change in a low-weight item.","Inflation is a rate of change in an index, not the same thing as the price level or the absolute price of a product.","Food, fuel and other components can contribute differently to inflation because their prices respond to supply conditions, global markets, taxes, demand and administered-price changes.","Comparisons should specify the base year, month, annual or monthly change and whether the series is CPI, WPI or another measure.","For Indian households, inflation affects purchasing power; for businesses it can affect input costs, margins, investment and pricing."],["mospi"],["CPI headline","CPI food","WPI","base effect"]],
["startups-unicorns","Startups / Unicorns","💡","IKT027","VERIFIED",["Startup India describes India as the world's third-largest startup ecosystem; recognised-startup counts change over time and should be checked against the latest official release.","Startup India (launched 2016) provides a framework for DPIIT recognition and access to eligible benefits; tax exemptions and other benefits have separate conditions.","India has a large unicorn ecosystem across sectors such as fintech, e-commerce, edtech and SaaS; unicorn counts vary by definition and reporting date.","A unicorn is a private startup valued at at least the commonly used threshold of US$1 billion; valuation is not the same as revenue or profit.","Startup ecosystems depend on founders, skills, capital, technology, customers, mentors, incubators and market access.","Startup survival and scale depend on unit economics, governance, product-market fit and access to follow-on capital.","Funding stages can include seed, venture rounds and later-stage financing, with different risk, dilution and governance implications.","DPIIT recognition is an official administrative status with defined eligibility, while private databases may use their own definitions for funding rounds and valuations.","Bengaluru, Mumbai and NCR are major startup destinations; rankings by funding or company count vary by dataset and year."],["startupindia","nsws","dpiit"],["recognised startups","funding rounds","unicorn count"]],
["institutions","Key Institutions","🏛","IKT028","VERIFIED",["MoSPI came into existence as an independent Ministry on 15 October 1999 after the merger of the Department of Statistics and the Department of Programme Implementation, and is the nodal agency for planned development of India's statistical system.","The Reserve Bank of India was established on 1 April 1935 in accordance with the Reserve Bank of India Act, 1934; its Central Office moved permanently to Mumbai in 1937 and it has been fully owned by the Government of India since nationalisation in 1949.","SEBI was constituted as a non-statutory body on 12 April 1988 by a Government of India resolution, became a statutory body in 1992, and its Act (15 of 1992) came into force on 30 January 1992.","The Election Commission of India is an autonomous constitutional authority that administers elections to the Lok Sabha, Rajya Sabha, State Legislative Assemblies and the offices of the President and Vice President; its Voters' Services Portal is at voters.eci.gov.in.","NDMA, headed by the Prime Minister, is the apex body for disaster management in India, mandated by the Disaster Management Act, 2005, and is organised into five divisions including Policy & Plans, Mitigation and Operations & Communications.","Udyam Registration is free, paperless and based on self-declaration; no documents need to be uploaded and Aadhaar is sufficient, while PAN and GSTIN became required from 1 April 2021, and there is no need for renewal.","UDISE+ sits under the Department of School Education & Literacy, Ministry of Education, and serves as the Ministry's official statistics, covering more than 1.5 million schools, 8.5 million teachers and 250 million children.","The Ministry of Jal Shakti functions through two departments: the Department of Water Resources, River Development & Ganga Rejuvenation, and the Department of Drinking Water & Sanitation.","UPSC publishes an annual examination calendar and maintains a list of active examinations; applications for those examinations are submitted through the online portal at upsconline.nic.in.","DGFT has warned citizens about spurious websites that resemble the official site and collect money on the false pretext of providing DGFT services including IEC certificates; applications should be submitted only through the official DGFT site.","DPIIT Startup Recognition applications are filed through the National Single Window System (nsws.gov.in), and DPIIT has stated that it has not appointed any agency or representative for its Certificate of Recognition.","The Supreme Court of India is the apex court of an integrated judiciary; eCourts services for High Courts and district courts are delivered through the e-Committee of the Supreme Court, and the Aadhaar programme is administered by UIDAI under MeitY."],["mospi","rbi","sebi","eci","ndma","udyam","udise","jalshakti","upsc","dgft","startupindia","sci","hc","uidai","meity"],["establishment year","mandate","parent ministry","official portal"]]

function toSentences(text){var out=[],cur="",i,c;text=String(text).replace(/\s+/g," ").trim();for(i=0;i<text.length;i++){c=text.charAt(i);cur+=c;if(c=="."||c==";"||c=="!"||c=="?"){if(cur.trim().length>26){out.push(cur.trim());cur="";}}}if(cur.trim().length>26) out.push(cur.trim());return out;}

function tokenSet(n){var t={},parts=n.split(" "),w;for(var i=0;i<parts.length;i++){w=parts[i];if(w.length>2&&!STOP[w]){if(!t[w]){t[w]=1;}}}return t;}
function inter(a,b){var c=0,k;for(k in a){if(b[k])c++;}return c;}
function jaccard(a,b){var i=inter(a,b),u=Object.keys(a).length+Object.keys(b).length-i;return u?i/u:0;}

function dedupe(rawFacts,opts){opts=opts||{};var cThr=(opts.contain==null?0.72:opts.contain),jThr=(opts.jaccard==null?0.45:opts.jaccard),items=[],i,j,p;for(i=0;i<rawFacts.length;i++){p=toSentences(rawFacts[i]);for(j=0;j<p.length;j++){if(p[j].length>26) items.push({text:p[j]});}}var kept=[],dropped=0;items.forEach(function(x){x.norm=normText(x.text);x.set=tokenSet(x.norm);});items.sort(function(a,b){return Object.keys(b.set).length-Object.keys(a.set).length || a.text.length-b.text.length;});for(i=0;i<items.length;i++){var dup=false;for(j=0;j<kept.length;j++){if(contain(items[i].set,kept[j].set)>=cThr||jaccard(items[i].set,kept[j].set)>=jThr){dup=true;break;}}if(dup){dropped++;}else{kept.push(items[i]);}}return {facts:kept,before:items.length,after:kept.length,dropped:dropped};}

"+(Math.log(2)/Math.log(1+ra3/100)).toFixed(2)+" years<small>The rule of 72 is a shortcut; the exact figure uses logarithms.</small>";}}else if(id==="pct"){var a=v("a"),b=v("b");if(a===0){r="The starting value cannot be zero.";}else{var ch=(b-a)/a*100;r="Change<b>"+(ch>=0?"+":"")+ch.toFixed(2)+"%</b>Absolute: "+(b-a>=0?"+":"")+fmt(b-a,2)+" · Ratio: "+(b/a).toFixed(3)+"×<small>Percentage change is relative to the starting value, so the direction of comparison matters.</small>";}}out.innerHTML=r;} 
function viewGaps(){var T=totals();var rows=STATE.modules.map(function(m){var r=cleanFacts(m);var linked=(m.srcs||[]).filter(function(id){return SRC[id]&&SRC[id].url;}).length;var total=(m.srcs||[]).length;var tag = total===0?'<span class="badge b-mu">NONE</span>':(linked===total?'<span class="badge b-ok">ALL '+total+'</span>':'<span class="badge b-warn">'+linked+'/'+total+'</span>');return '<tr><td>'+esc(m.name)+'</td><td>'+badge(m.status)+'</td><td class="num">'+r.before+'</td><td class="num">'+r.after+'</td><td class="num">'+r.dropped+'</td><td>'+tag+'</td></tr>'}).join("");return '<div class="fade"><div class="eyebrow">Quality assurance</div><h1>Gaps &amp; QA</h1><p class="sub">What this rebuild fixed, and what still needs a human decision.</p><div class="stats">'+stat("Raw",T.raw,"input")+stat("Unique",T.clean,"output")+stat("Removed",T.raw-T.clean,"dupes")+stat("Reduction",T.saved+"%","")+stat("Links",T.linksResolved+"/"+T.linksTotal,"resolved")+'</div><div class="tw"><table><thead><tr><th>Module</th><th>Status</th><th style="text-align:right">Sentences</th><th style="text-align:right">Unique</th><th style="text-align:right">Cut</th><th>Source links</th></tr></thead><tbody>'+rows+'</tbody></table></div><h2>Still outstanding</h2><div class="panel"><ol style="margin:0;padding-left:20px;color:var(--mu);line-height:1.8"><li><b style="color:var(--tx)">Add a review date per module.</b> None carry one; the PROVISIONAL modules (Demography, Industry / MSME, Health, Defence, Climate, Internal Security, Inflation) need re-verification first.</li><li><b style="color:var(--tx)">Import your full module set.</b> Only IKT001–IKT028 are in this build — paste the remaining modules into Import data.</li><li><b style="color:var(--tx)">Fill the exam fields.</b> Eligibility, stages, fees and cycle change every notification.</li><li><b style="color:var(--tx)">Replace process wording with citations.</b> "Check the latest release" should become a publication name plus period.</li><li><b style="color:var(--tx)">State DES stays state-wise.</b> The single registry entry points to MoSPI's contact list; add per-state portals only after you need them.</li></ol></div></div>';} 
function viewImport(){return '<div class="fade"><div class="eyebrow">Upstream data</div><h1>Import data</h1><p class="sub">Paste the full <code>window.IKT_DB</code> JSON from the original file. The dedupe engine runs on it, so bloated fact lists collapse automatically.</p><div class="panel"><label class="f"><span>Paste IKT_DB JSON</span><textarea id="imp" placeholder="{\"mods\":[{\"name\":\"Economy\",\"icon\":\"📊\",\"status\":\"VERIFIED\",\"code\":\"IKT001\",\"facts\":[\"…\",\"…\"],\"sources\":[\"MoSPI\",\"RBI\"]}]}\"></textarea></label><div class="row"><button class="btn" type="button" id="runImp">Import &amp; dedupe</button><button class="btn ghost" type="button" id="runSeed">Reset to built-in set</button><span id="impMsg" style="color:var(--mu);font-size:12.5px"></span></div></div><div class="panel"><h3>Similarity thresholds</h3><p class="sub" style="margin:6px 0 14px;font-size:13px">Lower merges more aggressively. Raise them if distinct facts are being collapsed.</p><div class="rng"><span>Containment (subset match)</span><input type="range" id="rc" min="0.4" max="0.98" step="0.02" value="'+STATE.opts.contain+'"><b id="rcv">'+STATE.opts.contain.toFixed(2)+'</b></div><div class="rng"><span>Jaccard (overlap)</span><input type="range" id="rj" min="0.2" max="0.9" step="0.02" value="'+STATE.opts.jaccard+'"><b id="rjv">'+STATE.opts.jaccard.toFixed(2)+'</b></div><div class="row" style="margin-top:6px"><button class="btn ghost" type="button" id="recalc">Recalculate</button><span id="rcMsg" style="color:var(--mu);font-size:12.5px"></span></div></div><div class="panel"><h3>Export</h3><p class="sub" style="margin:6px 0 12px;font-size:13px">Cleaned dataset for everything currently loaded, plus the source registry. Save as <code>data/modules.json</code>.</p><div class="row"><button class="btn" type="button" id="copy">Copy cleaned JSON</button><button class="btn ghost" type="button" id="show">Show preview</button></div><textarea id="out" style="margin-top:12px;min-height:190px;display:none" readonly></textarea></div></div>';} 
function importDB(obj){var mods=(obj&&(obj.mods||obj.modules))||[],out=[];for(var i=0;i<mods.length;i++){var m=mods[i];if(!m||!m.name) continue;var ids=[],s=(m.srcs||m.sources||[]);for(var k=0;k<s.length;k++){var nm=(typeof s[k]==="string")?s[k]:(s[k].name||"");var found=null;for(var j=0;j<SOURCES.length;j++){if(SOURCES[j].name.toLowerCase()===String(nm).toLowerCase()){found=SOURCES[j].id;break;}}ids.push(found||slug(nm)||("src"+k));if(!found&&nm){SRC[slug(nm)]={id:slug(nm),name:nm,url:"",checked:""};}}out.push({id:slug(m.name),name:m.name,icon:m.icon||"•",code:m.code||("IMP"+String(i+1)),status:String(m.status||"UNREVIEWED").toUpperCase(),facts:(m.facts||[]).slice(),srcs:ids,indicators:m.indicators||[]});}return out;} 
function exportJSON(){var T=totals();return JSON.stringify({version:"4.0",generated_by:"India Knowledge Terminal v4",sources:SOURCES.map(function(s){return {id:s.id,name:s.name,url:s.url||"",checked:s.checked||""};}),modules:STATE.modules.map(function(m){var r=cleanFacts(m);return {id:m.id,code:m.code,name:m.name,icon:m.icon,status:m.status,reviewed:"",facts:r.facts.map(function(f){return {text:f.text,source_ref:null};}),source_ids:m.srcs,indicators:m.indicators,_stats:{raw_facts:m.facts.length,sentences:r.before,unique_facts:r.after,removed:r.dropped}};}),exams:EXAMS.map(function(e){return {name:e[0],authority:e[1],level:e[2],category:e[4],source_id:e[3],eligibility:"",stages:"",fees:"",cycle:"",source_url:(SRC[e[3]]&&SRC[e[3]].url)||"",retrieved:""};}),_summary:{modules:T.mods,raw_items:T.raw,unique_facts:T.clean,reduction_pct:T.saved,sources_linked:T.verified,sources_unlinked:T.unverified,refs_resolved:T.linksResolved,refs_total:T.linksTotal,exams:EXAMS.length}},null,2);} 
function viewAbout(){return '<div class="fade"><div class="eyebrow">Product information</div><h1>About &amp; safety</h1><div class="panel"><dl class="kv"><dt>Version</dt><dd>4.0 — all sources linked, exams grouped</dd><dt>Inherits</dt><dd>India Knowledge Terminal (original single-file build)</dd><dt>Content</dt><dd>India reference knowledge, education only</dd><dt>Source links</dt><dd>verified 2 October 2026</dd><dt>Cleaning</dt><dd>Sentence split + containment/Jaccard dedupe</dd><dt>Not included</dt><dd>live prices, valuations, market data</dd></dl></div><div class="banner w"><b>Not investment advice.</b> Nothing here recommends buying or selling any security. All figures and rules change over time — a fact without a source and a retrieval date cannot be checked and should not be relied on.</div><div class="panel"><h3>Design rules this build follows</h3><ol style="margin:8px 0 0;padding-left:20px;color:var(--mu);line-height:1.8"><li><b style="color:var(--tx)">Never guess a URL.</b> A link is only added after the official portal was reached.</li><li><b style="color:var(--tx)">Separate the portal from the citation.</b> A working link is not evidence for a number.</li><li><b style="color:var(--tx)">Show gaps rather than hide them.</b> Missing dates and empty exam fields are surfaced in QA.</li><li><b style="color:var(--tx)">Keep content out of code.</b> Everything exports to plain JSON.</li><li><b style="color:var(--tx)">No stale numbers.</b> Rates, prices and standings are deliberately left out.</li></ol></div></div>';} 
function viewSearch(){var q=STATE.q.trim().toLowerCase();if(!q)return '<div class="fade"><div class="eyebrow">Search</div><h1>Search</h1><p class="sub">Type above to search module names, codes and every fact.</p><div class="empty">No query yet.</div></div>';var hits=[];STATE.modules.forEach(function(m){var r=cleanFacts(m);if((m.name+" "+m.code).toLowerCase().indexOf(q)>-1){hits.push({m:m,text:"Module · "+r.after+" facts",score:100});}r.facts.forEach(function(f){var i=f.text.toLowerCase().indexOf(q);if(i>-1) hits.push({m:m,text:f.text,score:50-Math.min(40,i/10)});});});hits.sort(function(a,b){return b.score-a.score;});hits=hits.slice(0,60);return '<div class="fade"><div class="eyebrow">Search</div><h1>“'+esc(STATE.q)+'”</h1><p class="sub">'+hits.length+' result'+(hits.length===1?"":"s")+'.</p>'+(hits.length?hits.map(function(x){return '<div class="res" data-open="'+esc(x.m.id)+'"><div class="rh"><span class="rn">'+esc(x.m.icon+" "+x.m.name)+'</span>'+badge(x.m.status)+'</div><div class="rm">'+hl(x.text,q)+'</div></div>'}).join(""):'<div class="empty">Nothing matched. Try a shorter term or the module code.</div>')+'</div>';} 
function hl(s,q){var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function render(){var body;if(STATE.open) body=viewDetail(STATE.open);else if(STATE.view==="modules") body=viewModules();else if(STATE.view==="exams") body=viewExams();else if(STATE.view==="sources") body=viewSources();else if(STATE.view==="tools") body=viewTools();else if(STATE.view==="gaps") body=viewGaps();else if(STATE.view==="import") body=viewImport();else if(STATE.view==="about") body=viewAbout();else if(STATE.view==="search") body=viewSearch();else body=viewOverview();app.innerHTML=header()+'<main>'+body+'</main>'+footer();bind();}
function go(v){if(v==="search"){STATE.open=null;STATE.view="search";}else{STATE.view=v;STATE.open=null;}render();window.scrollTo(0,0);} 
function openModule(id){STATE.open=id;render();window.scrollTo(0,0);} 
function bind(){var el=document.getElementById("theme"); if(el) el.onclick=function(){STATE.theme=STATE.theme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",STATE.theme);render();};el=document.getElementById("q");if(el)el.oninput=function(){STATE.q=el.value;if(STATE.q.trim()&&STATE.view!=="search"&&!STATE.open) STATE.view="search";if(!STATE.q.trim()&&STATE.view==="search") STATE.view="overview";var pos=el.selectionStart;render();var n=document.getElementById("q");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};el=document.getElementById("runImp");if(el)el.onclick=function(){var t=document.getElementById("imp"),msg=document.getElementById("impMsg"),txt=t.value.trim();if(!txt){msg.textContent="Paste the JSON first.";return;}try{var mods=importDB(JSON.parse(txt));if(!mods.length){msg.textContent="No modules found in that JSON.";return;}mods.forEach(function(m){if(!BYID[m.id]){BYID[m.id]=m;}});STATE.modules=mods;STATE.cache={};var T=totals();render();var m2=document.getElementById("impMsg");if(m2)m2.textContent="Imported "+T.mods+" modules · "+T.raw+" raw → "+T.clean+" unique ("+T.saved+"% removed).";}catch(e){msg.textContent="Invalid JSON: "+e.message;}};el=document.getElementById("runSeed");if(el)el.onclick=function(){STATE.modules=MODULES;STATE.cache={};render();};["rc","rj"].forEach(function(id){var s=document.getElementById(id);if(s)s.oninput=function(){var v=parseFloat(s.value);if(id==="rc"){STATE.opts.contain=v;var a=document.getElementById("rcv");if(a)a.textContent=v.toFixed(2);}else{STATE.opts.jaccard=v;var b=document.getElementById("rjv");if(b)b.textContent=v.toFixed(2);}STATE.cache={};var m=document.getElementById("rcMsg");if(m)m.textContent="Thresholds changed — press Recalculate.";};});el=document.getElementById("recalc");if(el)el.onclick=function(){STATE.cache={};var T=totals();render();var m=document.getElementById("rcMsg");if(m)m.textContent="Now "+T.clean+" unique facts from "+T.raw+" items ("+T.saved+"% removed).";};el=document.getElementById("show");if(el)el.onclick=function(){var o=document.getElementById("out");o.style.display="block";o.value=exportJSON();};el=document.getElementById("copy");if(el)el.onclick=function(){var o=document.getElementById("out");if(!o.value)o.value=exportJSON();o.style.display="block";o.select();var done=function(){var m=document.getElementById("rcMsg");if(m)m.textContent="Cleaned JSON copied.";};try{navigator.clipboard.writeText(o.value).then(done,function(){done();});}catch(e){done();}};Array.prototype.forEach.call(document.querySelectorAll("[data-run]"),function(b){b.onclick=function(){runCalc(b.getAttribute("data-run"));};});}
document.addEventListener("click",function(e){var t=e.target,n;t.closest?t.closest("[data-go]"):(n=null);n=t.closest?t.closest("[data-go]"):null;if(n){e.preventDefault();go(n.getAttribute("data-go"));return;}n=t.closest?t.closest("[data-open]"):null;if(n){e.preventDefault();openModule(n.getAttribute("data-open"));return;}n=t.closest?t.closest("[data-filter]"):null;if(n){e.preventDefault();STATE.filter=n.getAttribute("data-filter");render();return;}});window.addEventListener("hashchange",function(){var h=location.hash.replace(/^#\/?/,"");if(h.indexOf("m/")===0){openModule(h.slice(2));}else if(h){STATE.open=null;go(h);}});document.documentElement.setAttribute("data-theme",STATE.theme);render();try{var h=location.hash.replace(/^#\/?/,"");if(h&&h!=="overview"){if(h.indexOf("m/")===0) openModule(h.slice(2)); else go(h);}}catch(e){}}
</script>
